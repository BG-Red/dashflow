name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build the demo bundle
        # The demo runs entirely in the browser: the same UI, a synthetic estate, no server.
        run: bun run build:demo
        env:
          DEMO_BASE: /dashflow/
      - name: Single-page fallback for deep links
        run: cp apps/web/dist-demo/index.html apps/web/dist-demo/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
