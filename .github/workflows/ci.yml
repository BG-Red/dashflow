name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dashflow
          POSTGRES_PASSWORD: dashflow
          POSTGRES_DB: dashflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dashflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck (server and packages)
        run: bun run typecheck
      - name: Typecheck (web)
        run: bunx tsc --noEmit -p apps/web/tsconfig.json
      - name: Test
        run: bun run test
        env:
          TEST_DATABASE_URL: postgres://dashflow:dashflow@localhost:5432/dashflow_test
      - name: Build web
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install the browser
        run: bunx playwright install --with-deps chromium
      - name: End-to-end (demo build, no database)
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets and tenant identifiers
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: dashflow:ci

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the deployment template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
